name: Lint Shell & Python Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on all shell scripts
        run: shellcheck *.sh

      - name: Check Python syntax
        run: python3 -m py_compile *.py

